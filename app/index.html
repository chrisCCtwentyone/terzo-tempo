<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la pagina occupa tutto lo schermo dell'iPhone (anche sotto tacca e barra del gesto);
         ci pensa env(safe-area-inset-*) in base.css e ui.css a tenere fuori dalle zone coperte testi e barra. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Colori = --paper del tema chiaro e dell'"album di notte" (stili/tokens.css); il cambio tema a mano li aggiorna (lib/tema.ts). -->
    <meta name="theme-color" content="#f2e9d0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12162a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Aperta dalla Home di iPhone: a tutto schermo, col suo nome. Barra di stato "default": testo nero o bianco scelto dal
         sistema sul suo fondo, sempre leggibile (black-translucent avrebbe il testo bianco sull'avorio, contrasto 1,2:1). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Terzo Tempo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Terzo Tempo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
